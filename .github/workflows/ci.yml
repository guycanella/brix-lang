name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # LLVM 18 (inkwell `llvm18-0`) + LAPACK/BLAS (linked by every compiled
      # Brix program via `-llapack -lblas`).
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev libpolly-18-dev libzstd-dev zlib1g-dev \
            liblapack-dev libblas-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # LAPACK/BLAS come from the system Accelerate framework. llvm-sys links
        # -lzstd, which Homebrew keeps outside the default linker search path.
        run: |
          brew install llvm@18 zstd
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build

      - name: Unit tests (lexer, parser, codegen)
        run: cargo test -p lexer -p parser -p codegen

      # Must be sequential: every test compiles into the same repo-root
      # output.o / runtime.o / program.
      - name: Integration tests
        run: cargo test --test integration_test -- --test-threads=1

      # Runs every tests/brix/*.test.bx; exits 1 if any suite fails. Never
      # in parallel with the integration step (shared build artifacts).
      - name: Test Library
        run: cargo run -- test
